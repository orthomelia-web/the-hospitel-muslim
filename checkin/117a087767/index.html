<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Self Check-in Guide | THE HOSPITEL by Dr.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0d0d10; --surface:#131318; --gold:#c8a96a; --gold-soft:#a98850;
    --accent:#d4b67a; --ink:#f2efe8; --ink-sub:#d4ccba; --ink-dim:#8a8378;
    --line:#262628; --line-soft:#1c1c20;
    --serif-en:"Cormorant Garamond","Times New Roman",serif;
    --sans-en:"Inter",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--ink); font-family:var(--sans-en);
  }
  /* fixed backdrop layers (background-attachment:fixed is broken on iOS) */
  .bgimg {
    position:fixed; inset:0; z-index:-2;
    background:url('/tokyo-night.jpg') center 30%/cover no-repeat var(--bg);
  }
  .bgveil {
    position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(200,169,106,.06), transparent 70%),
      linear-gradient(to bottom, rgba(13,13,16,.62), rgba(13,13,16,.86) 45%, rgba(13,13,16,.93));
  }
  header { text-align:center; padding:56px 20px 30px; }
  .eyebrow {
    font-size:.68rem; letter-spacing:.32em; text-transform:uppercase;
    color:var(--gold); font-weight:400;
  }
  h1 {
    font-family:var(--serif-en); font-size:2.5rem; font-weight:300;
    letter-spacing:.08em; margin-top:14px; color:var(--ink);
  }
  .rule {
    width:56px; height:1px; background:var(--gold-soft);
    margin:22px auto 0; position:relative;
  }
  .rule::after {
    content:""; position:absolute; left:50%; top:50%;
    width:5px; height:5px; background:var(--gold);
    transform:translate(-50%,-50%) rotate(45deg);
  }
  .dl { text-align:center; padding:26px 20px 34px; }
  .dl a {
    display:inline-block; padding:13px 34px; border:1px solid var(--gold-soft);
    color:var(--gold); text-decoration:none; font-size:.72rem;
    letter-spacing:.22em; text-transform:uppercase; transition:all .3s ease;
  }
  .dl a:hover { background:var(--gold); color:var(--bg); border-color:var(--gold); }
  .pages { max-width:760px; margin:0 auto; padding:0 12px 56px; }
  .pages img {
    display:block; width:100%; height:auto; margin-bottom:14px;
    background:#fff; border:1px solid var(--line);
    box-shadow:0 6px 24px rgba(0,0,0,.45);
  }
  footer {
    text-align:center; padding:0 20px 52px;
  }
  footer .frule { width:56px; height:1px; background:var(--line); margin:0 auto 20px; }
  footer p {
    font-size:.66rem; letter-spacing:.18em; text-transform:uppercase;
    color:var(--ink-dim);
  }
  /* side rails — wide screens only */
  .rail {
    position:fixed; top:50%; transform:translateY(-50%);
    display:none; flex-direction:column; align-items:center; gap:18px;
    z-index:1; pointer-events:none;
  }
  .rail-l { left:34px; } .rail-r { right:34px; }
  .rail .bar { width:1px; height:110px; background:linear-gradient(to bottom, transparent, var(--gold-soft), transparent); }
  .rail span {
    writing-mode:vertical-rl; font-size:.62rem; letter-spacing:.42em;
    text-transform:uppercase; color:var(--ink-dim);
  }
  .rail .dot { width:4px; height:4px; background:var(--gold-soft); transform:rotate(45deg); }
  @media (min-width:1100px) { .rail { display:flex; } }
</style>
</head>
<body>
<div class="bgimg" aria-hidden="true"></div>
<div class="bgveil" aria-hidden="true"></div>
<div class="rail rail-l" aria-hidden="true">
  <div class="bar"></div>
  <span>The Hospitel by Dr.</span>
  <div class="dot"></div>
  <div class="bar"></div>
</div>
<div class="rail rail-r" aria-hidden="true">
  <div class="bar"></div>
  <span>Tokyo &mdash; Higashi-Mukojima</span>
  <div class="dot"></div>
  <div class="bar"></div>
</div>
<header>
  <div class="eyebrow">THE muslim-friendly HOSPITEL</div>
  <h1>Self Check-in Guide</h1>
  <div class="rule"></div>
</header>
<div class="dl"><a href="self-checkin-guide.pdf">Download PDF</a></div>
<div class="pages">
  <img src="pages/p01.jpg" alt="Self check-in guide page 1">
  <img src="pages/p02.jpg" alt="Self check-in guide page 2" loading="lazy">
  <img src="pages/p03.jpg" alt="Self check-in guide page 3" loading="lazy">
  <img src="pages/p04.jpg" alt="Self check-in guide page 4" loading="lazy">
  <img src="pages/p05.jpg" alt="Self check-in guide page 5" loading="lazy">
  <img src="pages/p06.jpg" alt="Self check-in guide page 6" loading="lazy">
  <img src="pages/p07.jpg" alt="Self check-in guide page 7" loading="lazy">
  <img src="pages/p08.jpg" alt="Self check-in guide page 8" loading="lazy">
  <img src="pages/p09.jpg" alt="Self check-in guide page 9" loading="lazy">
  <img src="pages/p10.jpg" alt="Self check-in guide page 10" loading="lazy">
  <img src="pages/p11.jpg" alt="Self check-in guide page 11" loading="lazy">
  <img src="pages/p12.jpg" alt="Self check-in guide page 12" loading="lazy">
  <img src="pages/p13.jpg" alt="Self check-in guide page 13" loading="lazy">
</div>
<footer>
  <div class="frule"></div>
  <p>The Hospitel by Dr. &mdash; For confirmed guests only</p>
</footer>
</body>
</html>
